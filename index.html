<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prince PDF Tools</title>

    <link rel="stylesheet" href="style.css">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<!-- Loading Screen -->

<div id="loading">

    <div class="loader"></div>

    <h1>Website Made By Prince</h1>

    <p>Loading...</p>

</div>

<!-- Main Website -->

<div id="main">

    <div class="card">

        <h1>📄 Prince PDF Tools</h1>

        <p class="subtitle">
            Create, Edit and Manage your PDF files in seconds.
        </p>

        <div class="buttons">

            <button class="btn create"
                onclick="window.location.href='create.html'">

                <i class="fa-solid fa-file-circle-plus"></i>

                Create a PDF

            </button>

            <button class="btn edit"
                onclick="window.location.href='edit.html'">

                <i class="fa-solid fa-pen-to-square"></i>

                Edit a PDF

            </button>

        </div>

        <footer>

            Made with ❤️ by Prince

        </footer>

    </div>

</div>

<script>

window.onload = function(){

    setTimeout(function(){

        document.getElementById("loading").style.display="none";

        document.getElementById("main").style.display="flex";

        document.body.style.overflow="auto";

    },3000);

};

</script>

</body>
</html>
