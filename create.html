<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create PDF | PDF Tools</title>

<link rel="icon" href="logo.png">

<link rel="stylesheet" href="create.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<!-- Back Button -->

<a href="index.html" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

</a>

<!-- Main -->

<div class="container">

<img src="logo.png" class="page-logo">

<h1>Create PDF</h1>

<p class="subtitle">

Convert Images into High Quality PDF

</p>

<!-- Upload Card -->

<div class="glass-card">

<label for="imageInput" class="upload-box">

<i class="fa-solid fa-images"></i>

<h2>Select Images</h2>

<p>

PNG, JPG & JPEG Supported

</p>

</label>

<input
type="file"
id="imageInput"
accept="image/*"
multiple
hidden>

<div id="imagePreview">

</div>

<button id="createBtn">

<i class="fa-solid fa-file-pdf"></i>

Create PDF

</button>

</div>
<!-- ==========================
        PDF SETTINGS
========================== -->

<div class="settings-card">

<h2>
<i class="fa-solid fa-sliders"></i>
PDF Settings
</h2>

<div class="setting-group">

<label>Page Size</label>

<select id="pageSize">

<option value="a4">A4</option>
<option value="letter">Letter</option>
<option value="legal">Legal</option>

</select>

</div>

<div class="setting-group">

<label>Orientation</label>

<select id="orientation">

<option value="portrait">Portrait</option>
<option value="landscape">Landscape</option>

</select>

</div>

<div class="setting-group">

<label>Image Quality</label>

<select id="quality">

<option value="1">High Quality</option>
<option value="0.8">Medium Quality</option>
<option value="0.6">Low Quality</option>

</select>

</div>

</div>

<!-- ==========================
      IMAGE PREVIEW
========================== -->

<div class="preview-card">

<h2>

<i class="fa-solid fa-images"></i>

Selected Images

</h2>

<div id="previewContainer">

<p class="empty-text">

No images selected yet.

</p>

</div>

</div>
